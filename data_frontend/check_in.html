<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Check-In | Latest Orders</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .customer-section { margin-bottom: 2.5rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
    th { background: #f0f0f0; }
    .ai-suggestion { margin-top: 1rem; padding: 1rem; background: #f9f9f9; border: 1px solid #ddd; }
    .error { color: red; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Check-In — Latest Orders</h1>
  <div id="loading">Loading, please wait...</div>
  <div id="customers"></div>

  <script>
    var API_BASE_URL = "https://5-musketeers-production.up.railway.app/";

    function buildSection(user) {
      var section = document.createElement("div");
      section.className = "customer-section";
      section.id = "customer-" + user.user_id;

      var heading = document.createElement("h2");
      heading.textContent = "User " + user.user_id;
      section.appendChild(heading);

      // Table
      var table = document.createElement("table");
      table.innerHTML =
        "<thead><tr>" +
          "<th>Product Name</th>" +
          "<th>Category</th>" +
          "<th>Description</th>" +
          "<th>Price</th>" +
          "<th>Stars</th>" +
        "</tr></thead>" +
        "<tbody><tr>" +
          "<td>" + (user.product_name  ?? "") + "</td>" +
          "<td>" + (user.category_name ?? "") + "</td>" +
          "<td>" + (user.short_desc    ?? "") + "</td>" +
          "<td>" + (user.price         ?? "") + "</td>" +
          "<td>" + (user.stars         ?? "") + "</td>" +
        "</tr></tbody>";
      section.appendChild(table);

      // AI suggestion
      if (user.ai_suggestion) {
        var box = document.createElement("div");
        box.className = "ai-suggestion";
        box.innerHTML = "<strong>AI Suggestion:</strong><p>" + user.ai_suggestion + "</p>";
        section.appendChild(box);
      }

      return section;
    }

    fetch(API_BASE_URL + "/check_in/all")
      .then(function(res) {
        if (!res.ok) throw new Error("API returned " + res.status);
        return res.json();
      })
      .then(function(users) {
        document.getElementById("loading").style.display = "none";
        var container = document.getElementById("customers");
        users.forEach(function(user) {
          container.appendChild(buildSection(user));
        });
      })
      .catch(function(err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("customers").innerHTML =
          "<p style='color:red'>Failed to load: " + err.message + "</p>";
      });
  </script>
</body>
</html>
