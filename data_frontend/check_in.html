<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Check-In | Latest Orders</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .customer-section { margin-bottom: 1.5rem; padding: 1rem; border: 1px solid #e0e0e0; }
    .customer-chunk { line-height: 1.7; }
    .error { color: red; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Check-In — Latest Orders</h1>
  <h2>Note: Controlled demo - Only first 5 customers returned</h2>
  <div id="loading">Loading, please wait...</div>
  <div id="customers"></div>

  <script>
    var API_BASE_URL = "https://5-musketeers-production.up.railway.app";

    function buildSection(user) {
      var section = document.createElement("div");
      section.className = "customer-section";
      section.id = "customer-" + user.customer_id;

      // Paragraph 1 — purchase info
      var purchaseInfo = "Customer " + user.customer_id + ". Purchase info:"
        + " product_name="        + (user.product_name        ?? "")
        + ", category="           + (user.product_category    ?? "")
        + ", pet_type="           + (user.pet_type            ?? "")
        + ", brand="              + (user.brand               ?? "")
        + ", description="        + (user.product_description ?? "")
        + ", weight="             + (user.product_weight      ?? "")
        + ", size="               + (user.product_size        ?? "")
        + ", packaging="          + (user.packaging_type      ?? "")
        + ", rating="             + (user.product_rating      ?? "")
        + ", number_of_reviews="  + (user.number_of_reviews   ?? "");

      var p1 = document.createElement("p");
      p1.className = "customer-chunk";
      p1.textContent = purchaseInfo;
      section.appendChild(p1);

      // Paragraph 2 — AI suggestion
      var p2 = document.createElement("p");
      p2.className = "customer-chunk";
      p2.textContent = "AI suggestion: " + (user.ai_suggestion ?? "");
      section.appendChild(p2);
      return section;
    }

    fetch(API_BASE_URL + "/check_in/all")
      .then(function(res) {
        if (!res.ok) throw new Error("API returned " + res.status);
        return res.json();
      })
      .then(function(users) {
        document.getElementById("loading").style.display = "none";
        var container = document.getElementById("customers");
        users.forEach(function(user) {
          container.appendChild(buildSection(user));
        });
      })
      .catch(function(err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("customers").innerHTML =
          "<p style='color:red'>Failed to load: " + err.message + "</p>";
      });
  </script>
</body>
</html>
